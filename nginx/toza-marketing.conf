# Apex marketing site — toza-platform.com only.
# Tenant app SPA: see toza-platform docs (server_name *.toza-platform.com).

server {
    listen 80;
    listen [::]:80;
    server_name toza-platform.com;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name toza-platform.com;

    ssl_certificate     /etc/letsencrypt/live/toza-platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toza-platform.com/privkey.pem;

    root /var/www/toza/marketing;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
