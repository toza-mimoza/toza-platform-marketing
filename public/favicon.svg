<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Toza">
  <defs>
    <linearGradient id="faceTop" x1="14" y1="10" x2="50" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4a4ad6"/>
      <stop offset="1" stop-color="#2d2db8"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="10" y1="24" x2="30" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1ea8"/>
      <stop offset="1" stop-color="#111184"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="34" y1="24" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121278"/>
      <stop offset="1" stop-color="#0a0a52"/>
    </linearGradient>
    <!--
      Typographic T inspired by geometric grotesk (bar + stem, rounded terminals).
      Origin = glyph optical center.
    -->
    <path
      id="tee"
      fill="#fff"
      d="M-5.8-5.9h11.6a0.95 0.95 0 0 1 0 1.9H0.85v10.1a0.95 0.95 0 0 1-1.9 0v-10.1h-4.75a0.95 0.95 0 0 1 0-1.9z"
    />
  </defs>

  <!-- Brick -->
  <path fill="url(#faceTop)" d="M32 12 L54 24.7 L32 37.4 L10 24.7 Z"/>
  <path fill="url(#faceLeft)" d="M10 24.7 L32 37.4 L32 56 L10 43.3 Z"/>
  <path fill="url(#faceRight)" d="M54 24.7 L32 37.4 L32 56 L54 43.3 Z"/>

  <!-- Four raised studs, 2×2, evenly spaced on the top face -->
  <g id="studs">
    <!-- positions: ±dx along iso-X, ±dy along iso-Y from top-face center (32, 24.7) -->
    <g transform="translate(23.8 19.6)">
      <ellipse cx="0" cy="2.1" rx="3.55" ry="2.05" fill="#2626a0"/>
      <rect x="-3.55" y="0" width="7.1" height="2.1" fill="#2626a0"/>
      <ellipse cx="0" cy="0" rx="3.55" ry="2.05" fill="#7a7af0"/>
      <ellipse cx="0" cy="-0.15" rx="2.1" ry="1.2" fill="#4a4ad6" opacity="0.55"/>
    </g>
    <g transform="translate(40.2 19.6)">
      <ellipse cx="0" cy="2.1" rx="3.55" ry="2.05" fill="#2626a0"/>
      <rect x="-3.55" y="0" width="7.1" height="2.1" fill="#2626a0"/>
      <ellipse cx="0" cy="0" rx="3.55" ry="2.05" fill="#7a7af0"/>
      <ellipse cx="0" cy="-0.15" rx="2.1" ry="1.2" fill="#4a4ad6" opacity="0.55"/>
    </g>
    <g transform="translate(23.8 28.8)">
      <ellipse cx="0" cy="2.1" rx="3.55" ry="2.05" fill="#2626a0"/>
      <rect x="-3.55" y="0" width="7.1" height="2.1" fill="#2626a0"/>
      <ellipse cx="0" cy="0" rx="3.55" ry="2.05" fill="#7a7af0"/>
      <ellipse cx="0" cy="-0.15" rx="2.1" ry="1.2" fill="#4a4ad6" opacity="0.55"/>
    </g>
    <g transform="translate(40.2 28.8)">
      <ellipse cx="0" cy="2.1" rx="3.55" ry="2.05" fill="#2626a0"/>
      <rect x="-3.55" y="0" width="7.1" height="2.1" fill="#2626a0"/>
      <ellipse cx="0" cy="0" rx="3.55" ry="2.05" fill="#7a7af0"/>
      <ellipse cx="0" cy="-0.15" rx="2.1" ry="1.2" fill="#4a4ad6" opacity="0.55"/>
    </g>
  </g>

  <!--
    Both T's share face-center height y=44.05 (midpoint of each side face).
    matrix(a,b,c,d,e,f): left uses +iso shear, right uses -iso shear, same scale.
  -->
  <use href="#tee" transform="matrix(1.15 0.58 0 0.92 21.8 44.05)"/>
  <use href="#tee" transform="matrix(1.15 -0.58 0 0.92 42.2 44.05)"/>
</svg>
