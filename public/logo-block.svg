<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" fill="none" role="img" aria-label="Toza">
  <!--
    Structure taken from the provided isometric 2×2 brick reference:
    light top plate, dark sides with light edge strokes, four rimmed studs.
    Brand palette + level T marks on both side faces.
  -->
  <defs>
    <path
      id="tee"
      fill="#F7F8FF"
      d="M-13.5-12.2h27c1.1 0 2 0.9 2 2v3.1c0 1.1-0.9 2-2 2H2.6v18.4c0 1.1-0.9 2-2 2h-1.2c-1.1 0-2-0.9-2-2V-5.1h-10.9c-1.1 0-2-0.9-2-2v-3.1c0-1.1 0.9-2 2-2z"
    />
  </defs>

  <!-- Left side -->
  <path fill="#111184"
        d="M18 58 L80 90 L80 122 L18 90 Z"/>
  <!-- Right side -->
  <path fill="#0a0a52"
        d="M142 58 L80 90 L80 122 L142 90 Z"/>

  <!-- Side edge strokes (as in the reference) -->
  <path d="M18 58 L80 90 L80 122 L18 90 Z" fill="none" stroke="#F7F8FF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M142 58 L80 90 L80 122 L142 90 Z" fill="none" stroke="#F7F8FF" stroke-width="3" stroke-linejoin="round"/>
  <path d="M80 90 L80 122" stroke="#F7F8FF" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Top plate -->
  <path fill="#F7F8FF" stroke="#0a0a52" stroke-width="3.2" stroke-linejoin="round"
        d="M80 26 L142 58 L80 90 L18 58 Z"/>

  <!-- Studs: match reference (dark body, white top ring, left highlight) -->
  <g id="studs">
    <!-- spacing mirrors the reference 2×2 on the diamond -->
    <g transform="translate(56 50)">
      <ellipse cx="0" cy="7" rx="12" ry="7" fill="#0a0a52"/>
      <path fill="#111184" d="M-12 0 V7 A12 7 0 0 0 12 7 V0 Z"/>
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#0a0a52"/>
      <ellipse cx="0" cy="0" rx="8.2" ry="4.8" fill="none" stroke="#F7F8FF" stroke-width="2.6"/>
      <path d="M-10.5 -1.5 C-12.2 0.8 -12.2 3.6 -10.5 5.6" fill="none" stroke="#F7F8FF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(104 50)">
      <ellipse cx="0" cy="7" rx="12" ry="7" fill="#0a0a52"/>
      <path fill="#111184" d="M-12 0 V7 A12 7 0 0 0 12 7 V0 Z"/>
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#0a0a52"/>
      <ellipse cx="0" cy="0" rx="8.2" ry="4.8" fill="none" stroke="#F7F8FF" stroke-width="2.6"/>
      <path d="M-10.5 -1.5 C-12.2 0.8 -12.2 3.6 -10.5 5.6" fill="none" stroke="#F7F8FF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(56 74)">
      <ellipse cx="0" cy="7" rx="12" ry="7" fill="#0a0a52"/>
      <path fill="#111184" d="M-12 0 V7 A12 7 0 0 0 12 7 V0 Z"/>
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#0a0a52"/>
      <ellipse cx="0" cy="0" rx="8.2" ry="4.8" fill="none" stroke="#F7F8FF" stroke-width="2.6"/>
      <path d="M-10.5 -1.5 C-12.2 0.8 -12.2 3.6 -10.5 5.6" fill="none" stroke="#F7F8FF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g transform="translate(104 74)">
      <ellipse cx="0" cy="7" rx="12" ry="7" fill="#0a0a52"/>
      <path fill="#111184" d="M-12 0 V7 A12 7 0 0 0 12 7 V0 Z"/>
      <ellipse cx="0" cy="0" rx="12" ry="7" fill="#0a0a52"/>
      <ellipse cx="0" cy="0" rx="8.2" ry="4.8" fill="none" stroke="#F7F8FF" stroke-width="2.6"/>
      <path d="M-10.5 -1.5 C-12.2 0.8 -12.2 3.6 -10.5 5.6" fill="none" stroke="#F7F8FF" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!--
    Face centers (left/right) share Y=100.
    matrix keeps both T's on that shared baseline while lying in each side plane.
  -->
  <use href="#tee" transform="matrix(1.05 0.54 0 0.9 49 100)"/>
  <use href="#tee" transform="matrix(1.05 -0.54 0 0.9 111 100)"/>
</svg>
