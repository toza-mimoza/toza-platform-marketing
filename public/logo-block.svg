<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Toza">
  <!-- Isometric LEGO-style block with T on each side face -->
  <defs>
    <linearGradient id="top" x1="16" y1="10" x2="48" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3a3acc"/>
      <stop offset="1" stop-color="#2d2db8"/>
    </linearGradient>
    <linearGradient id="left" x1="12" y1="22" x2="28" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a9a"/>
      <stop offset="1" stop-color="#111184"/>
    </linearGradient>
    <linearGradient id="right" x1="36" y1="22" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f0f6e"/>
      <stop offset="1" stop-color="#0a0a52"/>
    </linearGradient>
  </defs>

  <!-- Top face -->
  <path fill="url(#top)" d="M32 10 L52 21.5 L32 33 L12 21.5 Z"/>
  <!-- Left face -->
  <path fill="url(#left)" d="M12 21.5 L32 33 L32 54 L12 42.5 Z"/>
  <!-- Right face -->
  <path fill="url(#right)" d="M52 21.5 L32 33 L32 54 L52 42.5 Z"/>

  <!-- Stud (isometric ellipse + rim) -->
  <ellipse cx="32" cy="18.2" rx="6.2" ry="3.5" fill="#4a4ad4"/>
  <ellipse cx="32" cy="16.6" rx="6.2" ry="3.5" fill="#6a6aeb"/>
  <ellipse cx="32" cy="16.6" rx="3.4" ry="1.9" fill="#3a3acc" opacity="0.55"/>

  <!-- T on left face (skewed into isometric plane) -->
  <g fill="#fff" transform="translate(17.2 31.2) skewY(26.565) scale(0.92 0.78)">
    <rect x="0" y="0" width="12.5" height="2.6" rx="0.4"/>
    <rect x="4.95" y="2.2" width="2.6" height="11.2" rx="0.4"/>
  </g>

  <!-- T on right face -->
  <g fill="#fff" transform="translate(34.8 31.2) skewY(-26.565) scale(0.92 0.78)">
    <rect x="0" y="0" width="12.5" height="2.6" rx="0.4"/>
    <rect x="4.95" y="2.2" width="2.6" height="11.2" rx="0.4"/>
  </g>
</svg>
